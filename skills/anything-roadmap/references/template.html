<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>个人学习路线</title>
  <style>
    :root{--bg:#0b0e10;--surface:#11161a;--surface2:#171d21;--line:#2a3439;--text:#eef3e9;--muted:#98a59b;--faint:#6f7a72;--accent:#b7e46d;--accentInk:#162008;--core:#b7e46d;--support:#72b9c4;--branch:#d4a85d;--deferred:#747d78;--radius:12px;font-family:"Segoe UI","Noto Sans SC",system-ui,sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 0%,rgb(183 228 109/.07),transparent 34%),linear-gradient(rgb(255 255 255/.018) 1px,transparent 1px);background-size:auto,100% 40px}
    button,input{font:inherit}button{cursor:pointer;color:inherit}.shell{width:min(1480px,100%);margin:auto;padding:0 24px 72px;position:relative}
    header{padding:40px 0 28px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.55fr);gap:36px;align-items:end}.kicker{font:600 11px/1.4 ui-monospace,Consolas,monospace;color:var(--accent);letter-spacing:.15em;text-transform:uppercase}
    h1{font-size:clamp(34px,5.5vw,72px);line-height:1.02;letter-spacing:-.045em;margin:10px 0 14px}.context{color:var(--muted);line-height:1.65;max-width:68ch;margin:0}.graduation{border-left:2px solid var(--accent);padding:8px 0 8px 18px}.graduation span{display:block;color:var(--faint);font-size:12px;margin-bottom:8px}.graduation strong{font-size:18px;line-height:1.5}
    .toolbar{position:sticky;top:0;z-index:20;min-height:62px;display:flex;align-items:center;gap:8px;padding:10px 0;background:rgb(11 14 16/.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}button,.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}.toolbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}.search{color:var(--text);min-width:180px;flex:1}.search:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.status{color:var(--faint);font:12px/1.4 ui-monospace,Consolas,monospace;white-space:nowrap}
    .legend{display:flex;gap:14px;align-items:center;padding:18px 0;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:10px;height:3px;margin-right:5px;background:var(--c)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:24px}.panel{min-width:0}.panel-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.panel h2{font-size:24px;margin:0}.panel-head p{margin:0;color:var(--faint);font-size:12px}
    .map{display:grid;gap:12px}.module{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);overflow:hidden}.module>summary{list-style:none;cursor:pointer;padding:17px 18px;display:grid;grid-template-columns:1fr auto;gap:12px}.module>summary::-webkit-details-marker,.branch>summary::-webkit-details-marker{display:none}.module h3{margin:0;font-size:18px}.module small{display:block;color:var(--muted);margin-top:6px;line-height:1.45}.module-count{font:11px/1.4 ui-monospace,monospace;color:var(--accent)}.module-body{padding:0 14px 14px;display:grid;gap:8px}
    .branch{border-left:1px solid var(--line);margin-left:8px}.branch>summary{list-style:none;cursor:pointer;padding:10px 14px;color:var(--muted)}.branch>summary:before{content:"+";color:var(--accent);margin-right:9px}.branch[open]>summary:before{content:"−"}.branch-body{padding-left:16px;display:grid;gap:7px}
    .kp{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 12px;border:1px solid transparent;border-radius:8px;background:var(--surface2);transition:border-color .2s,opacity .2s}.kp strong{font-size:14px}.kp p{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.5;margin:0}.kp .id{font:10px/1.4 ui-monospace,monospace;color:var(--faint)}.kp.selected{border-color:var(--role,var(--accent));background:color-mix(in srgb,var(--role,var(--accent)) 9%,var(--surface2))}.kp.dim{opacity:.28}.kp.focus{outline:2px solid var(--accent);outline-offset:2px}
    .path{position:sticky;top:82px;max-height:calc(100dvh - 105px);overflow:auto;padding-right:4px}.contract{padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px}.contract h3{font-size:13px;margin:0 0 9px;color:var(--muted)}.contract ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.6}
    .cap-list{display:grid;gap:9px}.cap{width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--role);background:var(--surface);padding:14px;border-radius:0 var(--radius) var(--radius) 0}.cap:hover,.cap.active{background:var(--surface2);border-color:var(--role)}.cap .top{display:flex;justify-content:space-between;gap:12px;align-items:center}.cap .role{font:10px/1 ui-monospace,monospace;text-transform:uppercase;color:var(--role)}.cap strong{font-size:15px}.cap p{color:var(--muted);font-size:12px;line-height:1.5;margin:8px 0 0}.cap .reason{color:var(--faint)}.sequence{font:11px/1 ui-monospace,monospace;color:var(--faint);min-width:24px}
    .view-hidden{display:none!important}.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:24px;color:var(--muted)}footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--faint);font-size:12px}
    @media(max-width:960px){.workspace{grid-template-columns:1fr}.path{position:static;max-height:none}header{grid-template-columns:1fr}.toolbar{overflow:auto}.status{display:none}}
    @media(max-width:620px){.shell{padding-inline:14px}.toolbar button{padding-inline:9px}.legend{overflow:auto}.panel-head{display:block}.panel-head p{margin-top:6px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.kp{transition:none}}
    @media print{body{background:#fff;color:#111}body:before,.toolbar{display:none}.shell{width:100%;padding:0}.workspace{display:block}.path{position:static;max-height:none}.module,.contract,.cap{background:#fff;border-color:#aaa}.kp{background:#fff}.kp.dim{opacity:1}.context,.kp p,.cap p,.contract ul{color:#333}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="kicker">Visible learning path</div><h1 id="title">个人学习路线</h1><p class="context" id="context"></p></div><div class="graduation"><span>毕业任务</span><strong id="graduation"></strong></div></header>
    <nav class="toolbar" aria-label="路线视图">
      <button type="button" data-view="both" aria-pressed="true">全局 + 我的路线</button><button type="button" data-view="map" aria-pressed="false">只看全局</button><button type="button" data-view="path" aria-pressed="false">只看路线</button>
      <input class="search" id="search" type="search" placeholder="搜索知识点或能力" aria-label="搜索">
      <span class="status" id="status"></span>
    </nav>
    <div class="legend"><span><i style="--c:var(--core)"></i>核心</span><span><i style="--c:var(--support)"></i>必要支撑</span><span><i style="--c:var(--branch)"></i>按需分支</span><span><i style="--c:var(--deferred)"></i>明确延后</span></div>
    <div class="workspace">
      <section class="panel" id="mapPanel"><div class="panel-head"><h2>完整领域地图</h2><p>选择能力可定位相关知识点</p></div><div class="map" id="map"></div></section>
      <aside class="panel path" id="pathPanel"><div class="panel-head"><h2>我的能力路径</h2><p id="pathMeta"></p></div><div class="contract"><h3>完成证据</h3><ul id="evidence"></ul></div><div class="cap-list" id="capabilities"></div></aside>
    </div>
    <footer><span id="identity"></span><span>路线透明，学习者保留选择权</span></footer>
  </div>
  <script>
  /* DOMAIN_MAP_DATA_START */
  const DOMAIN_MAP={"schema_version":"1.0","domain_map_id":"dm-example","version":"1.0.0","generated_at":"2026-09-03","domain":{"name":"示例领域","definition":"演示完整地图与个人路线叠加。","core_questions":[],"scope":{"includes":[],"excludes":[],"interfaces":[]}},"modules":[{"id":"m-foundation","type":"module","title":"基础","summary":"建立共同语言。","why":"后续能力依赖这些定义。","stage":"foundation","children":[{"id":"kp-one","type":"knowledge_point","title":"知识点一","definition":"第一个示例知识点。","importance":"用于能力一。","problems":[],"prerequisites":[],"leads_to":["kp-two"],"applications":[],"difficulty":"foundation","source_ids":["src-one"]},{"id":"kp-two","type":"knowledge_point","title":"知识点二","definition":"第二个示例知识点。","importance":"用于能力二。","problems":[],"prerequisites":["kp-one"],"leads_to":[],"applications":[],"difficulty":"core","source_ids":["src-one"]}]}],"relationships":[],"typical_traversal":["m-foundation"],"sources":[{"id":"src-one","title":"RFC 2119","url":"https://www.rfc-editor.org/rfc/rfc2119","verified_at":"2026-09-03"}]};
  /* DOMAIN_MAP_DATA_END */
  /* LEARNING_PATH_DATA_START */
  const LEARNING_PATH={"schema_version":"1.0","roadmap_id":"rm-example","version":"1.0.0","generated_at":"2026-09-03","domain_map_ref":{"domain_map_id":"dm-example","version":"1.0.0","path":"domain-map.json"},"learner":{"learner_id":"learner-local","background":"示例背景"},"learning_contract":{"goal_context":"在示例情境中应用知识。","graduation_task":"独立完成一个未见过的综合任务。","constraints":["示例约束"],"completion_evidence":["无提示复述","完成近迁移","完成陌生任务"]},"capabilities":[{"id":"cap-one","title":"解释知识点一","statement":"面对新案例，能解释知识点一的作用。","role":"core","selection_reason":"直接支持毕业任务。","knowledge_links":[{"knowledge_point_id":"kp-one","role":"conceptual_basis"}],"prerequisite_capability_ids":[],"strategy":"mental_model","verification":"rubric","lesson_file":"content/cap-one.md","mastery_requirement":{"minimum_level_to_advance":"near_transfer","unassisted_required":true,"evidence_count":2},"diagnostic":{"task_id":"diag-one","branching_value":"识别当前模型"},"assessment":{"seed_task_ids":["task-one"],"rubric_id":"rubric-one"},"remediation":{"likely_errors":[],"branch_capability_ids":[]}},{"id":"cap-two","title":"应用知识点二","statement":"在陌生限制下正确应用知识点二。","role":"support","selection_reason":"为核心能力提供必要支撑。","knowledge_links":[{"knowledge_point_id":"kp-two","role":"procedure"}],"prerequisite_capability_ids":["cap-one"],"strategy":"procedure","verification":"executable","lesson_file":"content/cap-two.md"}],"recommended_sequence":["cap-one","cap-two"],"projects":[{"id":"project-graduation","type":"graduation","title":"陌生综合任务","capability_ids":["cap-one","cap-two"],"novelty_constraints":["更换情境"],"hint_policy":"limited","rubric_id":"rubric-graduation"}],"sources":[]};
  /* LEARNING_PATH_DATA_END */
  const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const roleColor={core:"var(--core)",support:"var(--support)",branch:"var(--branch)",deferred:"var(--deferred)"};const roleName={core:"核心",support:"必要支撑",branch:"按需分支",deferred:"明确延后"};
  const nodeMap=new Map(),pointToCaps=new Map();function index(n){nodeMap.set(n.id,n);(n.children||[]).forEach(index)};(DOMAIN_MAP.modules||[]).forEach(index);
  (LEARNING_PATH.capabilities||[]).forEach(c=>(c.knowledge_links||[]).forEach(l=>{const a=pointToCaps.get(l.knowledge_point_id)||[];a.push(c);pointToCaps.set(l.knowledge_point_id,a)}));
  function countPoints(n){return n.type==="knowledge_point"?1:(n.children||[]).reduce((a,c)=>a+countPoints(c),0)}
  function point(n){const caps=pointToCaps.get(n.id)||[],role=caps[0]?.role;return `<article class="kp ${caps.length?"selected":""}" style="--role:${roleColor[role]||"var(--accent)"}" data-id="${esc(n.id)}" data-search="${esc([n.title,n.definition,...caps.map(c=>c.title)].join(" ").toLowerCase())}"><strong>${esc(n.title)}</strong><span class="id">${esc(n.id)}</span><p>${esc(n.definition)}</p></article>`}
  function branch(n){if(n.type==="knowledge_point")return point(n);return `<details class="branch" open><summary>${esc(n.title)}</summary><div class="branch-body">${(n.children||[]).map(branch).join("")}</div></details>`}
  function module(n){return `<details class="module" open><summary><div><h3>${esc(n.title)}</h3><small>${esc(n.summary)}</small></div><span class="module-count">${countPoints(n)} KP</span></summary><div class="module-body">${(n.children||[]).map(branch).join("")}</div></details>`}
  function capability(c,i){return `<button class="cap" type="button" style="--role:${roleColor[c.role]||"var(--deferred)"}" data-cap="${esc(c.id)}" data-points="${esc((c.knowledge_links||[]).map(l=>l.knowledge_point_id).join(" "))}" data-search="${esc([c.title,c.statement,c.selection_reason].join(" ").toLowerCase())}"><div class="top"><span class="sequence">${String(i+1).padStart(2,"0")}</span><strong>${esc(c.title)}</strong><span class="role">${esc(roleName[c.role]||c.role)}</span></div><p>${esc(c.statement)}</p><p class="reason">${esc(c.selection_reason)}</p></button>`}
  const caps=LEARNING_PATH.capabilities||[],seq=LEARNING_PATH.recommended_sequence||[],ordered=[...caps].sort((a,b)=>{const ai=seq.indexOf(a.id),bi=seq.indexOf(b.id);return (ai<0?999:ai)-(bi<0?999:bi)});
  $("#title").textContent=`${DOMAIN_MAP.domain?.name||"领域"} / 我的路线`;$("#context").textContent=LEARNING_PATH.learning_contract?.goal_context||"未提供目标情境";$("#graduation").textContent=LEARNING_PATH.learning_contract?.graduation_task||"未定义毕业任务";$("#evidence").innerHTML=(LEARNING_PATH.learning_contract?.completion_evidence||[]).map(x=>`<li>${esc(x)}</li>`).join("")||"<li>未定义</li>";$("#map").innerHTML=(DOMAIN_MAP.modules||[]).map(module).join("")||'<div class="empty">公共地图为空。</div>';$("#capabilities").innerHTML=ordered.map(capability).join("")||'<div class="empty">个人路线为空。</div>';$("#pathMeta").textContent=`${caps.length} 项能力`;$("#status").textContent=`${DOMAIN_MAP.modules?.length||0} 模块 / ${caps.length} 能力`;$("#identity").textContent=`${LEARNING_PATH.roadmap_id} @ ${LEARNING_PATH.version}`;
  function setView(view){document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===view)));$("#mapPanel").classList.toggle("view-hidden",view==="path");$("#pathPanel").classList.toggle("view-hidden",view==="map");$(".workspace").style.gridTemplateColumns=view==="both"?"minmax(0,1.15fr) minmax(360px,.85fr)":"1fr"}
  function focusCap(button){document.querySelectorAll(".cap").forEach(x=>x.classList.toggle("active",x===button));const ids=new Set(button.dataset.points.split(" ").filter(Boolean));document.querySelectorAll(".kp").forEach(p=>{p.classList.toggle("dim",!ids.has(p.dataset.id));p.classList.toggle("focus",ids.has(p.dataset.id))});const first=[...ids][0];if(first){const el=document.querySelector(`.kp[data-id="${CSS.escape(first)}"]`);el?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"})}$("#status").textContent=`定位 ${button.querySelector("strong").textContent}`}
  document.addEventListener("click",e=>{const view=e.target.closest("[data-view]");if(view)setView(view.dataset.view);const cap=e.target.closest(".cap");if(cap)focusCap(cap)});$("#search").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();let n=0;document.querySelectorAll("[data-search]").forEach(el=>{const hit=!q||el.dataset.search.includes(q);el.classList.toggle("view-hidden",!hit);if(hit)n++});$("#status").textContent=q?`匹配 ${n} 项`:`${DOMAIN_MAP.modules?.length||0} 模块 / ${caps.length} 能力`});
  </script>
</body>
</html>
